name: Monitor SECOP II

on:
  schedule:
    - cron: "50 11 * * *"  # 6:50 a.m. hora Colombia (UTC-5); apunta a que el correo llegue cerca de las 7:00 a.m., porque el scheduler de GitHub suele retrasar los runs unos minutos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
        run: python main.py

      - name: Guardar historial de procesos vistos
        run: |
          git config user.name "secop-monitor-bot"
          git config user.email "actions@github.com"
          git add database/historial.db
          git diff --staged --quiet || git commit -m "chore: update SECOP tracker"
          git pull --rebase
          git push
